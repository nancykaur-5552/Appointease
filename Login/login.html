<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="../Logo1.PNG" alt="Appointease Logo">
        </div>
        <div class="navlinks">
            <a href="../Home/home.html">Home</a>
            <a href="../About Us/about.html">About Us</a>
            <a href="../All Doctors/doctor.html">All Doctors</a>
            <a href="../Contact Us/contact.html">Contact Us</a>
        </div>
        <button class="account">Create Account</button>
    </nav>
    <div class="acc">
    <div class="login-account">
        <h2>Login Account</h2>
        <p>Please login to book an appointment.</p>
        <form action="" id="loginAccountForm">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <button type="submit" class="login">Login</button>
            <p class="loginacc">Already have an account? <a href="../Login/login.html" onclick="loginAccount()">Login here</a></p>
        </form>
    </div>
</div>
</body>
<script>
    function loginAccount() {
        window.open('../Login/login.html','_self')
    }
</script>
</html>
